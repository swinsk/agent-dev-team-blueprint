name: check-adapters

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adapters match roles/
        run: python3 scripts/build_adapters.py --check
      - name: No em dashes or en dashes
        run: |
          python3 - <<'EOF'
          import pathlib, sys
          bad = [f"{p}:{n}" for p in pathlib.Path(".").rglob("*")
                 if p.is_file() and ".git" not in p.parts
                 for n, line in enumerate(p.read_text(encoding="utf-8", errors="ignore").splitlines(), 1)
                 if chr(0x2014) in line or chr(0x2013) in line]
          if bad:
              print("Em or en dash found (use a hyphen, colon, or comma):", *bad, sep="\n  ")
              sys.exit(1)
          EOF
